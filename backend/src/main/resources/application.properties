
spring.application.name=descanso-by-gi

# Render asigna PORT en producción; localmente se conserva el puerto habitual.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Origen permitido del frontend. En despliegue se configura CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT
# Clave para firmar los tokens (mínimo 32 caracteres). Sin valor por defecto:
# si JWT_SECRET no está definida, la aplicación no arranca.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60
